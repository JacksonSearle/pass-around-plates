<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pass Around Plates</title>
  <meta name="description" content="The family recipe collection.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='32' cy='32' r='28' fill='%23c4532d'/><circle cx='32' cy='32' r='18' fill='none' stroke='%23fff' stroke-width='3'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="#/">
        <svg class="brand-mark" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="28"/><circle cx="32" cy="32" r="18" class="rim"/></svg>
        <span class="brand-name" id="brand-name">Pass Around Plates</span>
      </a>
      <form class="search" role="search" id="search-form">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="search" type="search" placeholder="Search recipes, ingredients…" autocomplete="off" aria-label="Search recipes">
      </form>
      <a class="btn btn-primary add-btn" href="#/new">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>Add recipe</span>
      </a>
    </div>
  </header>
  <main id="app" class="wrap" tabindex="-1">
    <p class="loading">Loading recipes…</p>
  </main>
  <footer class="site-footer wrap">
    <p>Recipes from <a href="https://passaroundplates.blogspot.com/" rel="noopener">Pass Around Plates</a>, the family food blog.</p>
  </footer>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script src="config.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
